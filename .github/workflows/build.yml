name: Build CDHNMS ERP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, openssl, pdo, pdo_mysql
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Install Composer
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader --no-scripts --no-security-blocking

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          mkdir -p bootstrap/cache
          mkdir -p storage/framework/cache
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p storage/logs

      - name: Create deployment package
        run: zip -r cdhnms-build.zip . -x ".git/*" ".github/*"

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: cdhnms-build
          path: cdhnms-build.zip
